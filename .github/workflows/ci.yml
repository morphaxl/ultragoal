name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Gate engine tests
        run: bash tests/gate-test.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Installer syntax check
        run: node --check installer/cli.mjs
      - name: npm package sanity
        run: npm pack --dry-run
